name: Deploy Next.js to ECS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write   
  contents: read    

env:
  ENV: prod
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ca-nextjs
  ECS_CLUSTER: ca-prod-cluster
  ECS_SERVICE: nextjs-service
  RESOURCE_ID: service/ca-prod-cluster/nextjs-service

jobs:
  build:
    runs-on: ubuntu-latest
    outputs: 
      image_tag: ${{ steps.set-tag.outputs.tag }} 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Authenticate with AWS using OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 2. Login to ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 3. Build & Push Image
      - name: Build, Tag, and Push Image to ECR
        id: set-tag
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Install ecspresso
        uses: kayac/ecspresso@v2
        with:
          version: v2.7.1

      - name: Deploy to ECS
        run: |
          cd deploy/${{ env.ENV }}/
          ecspresso verify

          SERVICE_STATUS=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --query "services[0].status" \
            --output text)

          if [ "$SERVICE_STATUS" != "ACTIVE" ]; then
            echo "Service not found. Running initial create..."
            ecspresso deploy
          else
            echo "Service is active. Running deploy..."
            ecspresso deploy --tasks=-1 --wait
          fi
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}

      # 5. Sync Autoscaling Boundaries
      - name: Configure Application Auto Scaling
        run: |
          aws application-autoscaling register-scalable-target \
            --service-namespace ecs \
            --resource-id service/${{ env.ECS_CLUSTER }}/${{ env.ECS_SERVICE }} \
            --scalable-dimension ecs:service:DesiredCount \
            --min-capacity 2 \
            --max-capacity 10

          aws application-autoscaling put-scaling-policy \
            --service-namespace ecs \
            --resource-id ${{ env.RESOURCE_ID }} \
            --scalable-dimension ecs:service:DesiredCount \
            --policy-name cpu-autoscaling \
            --policy-type TargetTrackingScaling \
            --target-tracking-configuration '{
                "TargetValue": 50.0,
                "PredefinedMetricSpecification": {
                    "PredefinedMetricType": "ECSServiceAverageCPUUtilization"
                }
            }'
